data:
  root: "F:/terrain_data"
  splits_file: "training/splits.json"
  depth_stats_file: "training/depth_stats.json"

training:
  batch_size: 16
  epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  val_ratio: 0.2
  seed: 42
  warmup_epochs: 5        # linear LR ramp-up from 0 → learning_rate
  grad_clip: 1.0          # max gradient norm; 0 to disable
  early_stop_patience: 15 # stop if val loss hasn't improved for N epochs
  gpu_memory_margin: 0.20 # keep this fraction of VRAM free (auto-tunes batch size)

checkpoints:
  dir: "training/checkpoints"
  save_every: 1

model:
  feat_proj_dim: 128
  pose_embed_dim: 32
  fusion_dim: 512

curriculum:
  enabled: true
  start_size: 20            # episodes in first pool (high-variance ones picked first)
  expand_by: 20             # add this many per expansion
  plateau_patience: 8       # epochs without height improvement before expanding
  min_improvement: 0.02     # relative improvement threshold (2%) — avoids noise resets
  max_epochs_per_pool: 40   # force expansion after N epochs even if still improving
  target_steps_per_epoch: 200  # repeat small pools to maintain this many steps/epoch
