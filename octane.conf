# OCTANE rover configuration
# Sourced by launch_system.sh, exec_ros.sh, and setup_mdns.sh.
# Edit here — scripts derive all runtime settings from these values.

# ── Identity ──────────────────────────────────────────────────────────────────
# Hostname the rover advertises on the network.
# The rover will be reachable as ${OCTANE_HOSTNAME}.local via mDNS.
OCTANE_HOSTNAME=octane

# Human-readable name shown in mDNS service browsers (e.g. avahi-browse).
OCTANE_SERVICE_NAME="OCTANE Rover"

# ── Network ports ─────────────────────────────────────────────────────────────
# TCP port the ground station GUI connects to for mode commands + telemetry.
OCTANE_TCP_PORT=5000

# UDP port used for the rover heartbeat broadcast.
OCTANE_UDP_PORT=5001

# Optional: bind the heartbeat socket to a specific local IP so it goes out
# the right interface when multiple NICs are present (WiFi + Ethernet + USB).
# Leave empty to let the OS pick based on the default route.
# Example: OCTANE_UDP_BIND_IP=192.168.1.100  (rover's WiFi IP)
OCTANE_UDP_BIND_IP=""

# ── mDNS interfaces ───────────────────────────────────────────────────────────
# Comma-separated list of interfaces avahi advertises on.
# Leave blank to advertise on ALL interfaces (avahi default — safe choice).
# Known Jetson interfaces: wlP1p1s0 (WiFi), eno1 (Ethernet), usb0/usb1 (USB-Ethernet)
OCTANE_INTERFACES="wlP1p1s0,eno1,usb0,usb1"

# ── mDNS protocol ─────────────────────────────────────────────────────────────
OCTANE_USE_IPV4=yes
OCTANE_USE_IPV6=no
