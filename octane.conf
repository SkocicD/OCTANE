# OCTANE rover configuration
# Sourced by launch_system.sh, exec_ros.sh, and setup_mdns.sh.
# Edit here — scripts derive all runtime settings from these values.

# ── Identity ──────────────────────────────────────────────────────────────────
# Hostname the rover advertises on the network.
# The rover will be reachable as ${OCTANE_HOSTNAME}.local via mDNS.
OCTANE_HOSTNAME=octane

# Human-readable name shown in mDNS service browsers (e.g. avahi-browse).
OCTANE_SERVICE_NAME="OCTANE Rover"

# ── Network ports ─────────────────────────────────────────────────────────────
# TCP port the ground station GUI connects to for mode commands, telemetry, and heartbeat.
OCTANE_TCP_PORT=5000


# ── mDNS interfaces ───────────────────────────────────────────────────────────
# Comma-separated list of interfaces avahi advertises on.
# Leave blank to advertise on ALL interfaces (avahi default — safe choice).
# Known Jetson interfaces: wlP1p1s0 (WiFi), eno1 (Ethernet), l4tbr0 (USB-Ethernet bridge for usb0/usb1)
# usb0/usb1 are bridge slaves under l4tbr0 — avahi must listen on the bridge, not the slaves
OCTANE_INTERFACES="wlP1p1s0,eno1,l4tbr0"

# ── mDNS protocol ─────────────────────────────────────────────────────────────
OCTANE_USE_IPV4=yes
OCTANE_USE_IPV6=no
