# AprilTag field map for OCTANE localization.
#
# Field layout (2m x 2m corner, origin at (0,0)):
#
#   (0,2) ──────────── (2,2)
#     |                  |
#     |                  |
#   (0,0) ──────────── (2,0)
#
# facing_deg: direction the tag face points in field frame
#   (0° = +X / right wall, 90° = +Y / back wall, 45° = corner)

apriltag_map:
  - id: 1
    x: 0.0
    y: 0.0
    facing_deg: 45.0    # origin corner tag

  - id: 2
    x: 2.0
    y: 0.0
    facing_deg: 0.0     # right wall tag

  - id: 3
    x: 0.0
    y: 2.0
    facing_deg: 90.0    # back wall tag

# Camera mount angles on the rover body.
# 0° = rover forward (+X), positive = counterclockwise.
cameras:
  far_front:
    mount_angle_deg: 0.0
  far_right:
    mount_angle_deg: -90.0
  far_back:
    mount_angle_deg: 180.0
  far_left:
    mount_angle_deg: 90.0
