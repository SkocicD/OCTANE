arenas:

  ksc:
    # KSC Artemis 2026 — left-column excavation, bottom-right deposit, bottom-left start
    base_width:  6.88
    base_length: 5.0
    excavation_width_frac: 0.363   # 2.5 / 6.88  (left column)
    start_length_frac:     0.400   # 2.0 / 5.0   (start zone height, bottom-left)
    deposit_length_frac:   0.300   # 1.5 / 5.0   (deposit/construction zone height, bottom-right)
    berm_w: 1.7
    berm_h: 0.8
    column_size: 0.4
    rocks_mean:      3
    craters_mean:    2
    rock_diameter:   0.35
    crater_diameter: 0.45
    obstacle_spread: 1.6

  ucf:
    # UCF Practice Arena 2026 — upper-left excavation, bottom-left deposit, top-right start
    base_width:  8.10
    base_length: 4.57
    construction_w_frac: 0.321   # 2.6 / 8.10  (bottom-left construction zone width)
    construction_h_frac: 0.438   # 2.0 / 4.57  (construction zone height)
    excavation_w_frac:   0.494   # 4.0 / 8.10  (upper-left excavation zone width)
    start_w_frac:        0.247   # 2.0 / 8.10  (start zone width, from right edge)
    start_h_frac:        0.438   # 2.0 / 4.57  (start zone height, from top edge)
    berm_w: 1.5
    berm_h: 0.9
    column_size: 0.0             # no fixed column at UCF
    rocks_mean:      3
    craters_mean:    2
    rock_diameter:   0.35
    crater_diameter: 0.45
    obstacle_spread: 1.6

terrain:
  grid_size: 80          # cells — must match deployment crop from terrain model (4.0m / 0.05m = 80)
  cell_size:  0.05       # metres per cell — matches ml/terrain_model CELL_SIZE=0.05
  view_width: 4.0        # metres visible left/right  (80 cells × 0.05m = 4.0m exactly)
  view_height: 4.0       # metres visible forward/back
  height_noise_std: 0.04
  height_scale: 0.5

planner:
  slope_weight:  2.0
  crater_weight: 8.0
  rock_weight:   6.0
  wall_weight:   50.0
  lookahead: 8
  # Speed-aware expert: slow down when the A* path passes near an obstacle
  slow_radius:   1.0    # metres ahead on path to check for obstacles
  slow_min:      0.35   # minimum speed multiplier when obstacle on path (never dead-stop)

robot:
  # 3-wheel differential drive, 14" diameter wheels, 35 RPM max
  v_max:           0.652   # 35 RPM × π × 0.3556m / 60  (m/s per wheel at full speed)
  wheel_base:      0.483   # wheel-centre spacing (m) — 19 in
  diff_limit:      0.8     # max |left - right|; hardware limit
  robot_width:     0.75    # physical robot body width (m)
  robot_length:    1.5     # physical robot body length (m)
  projection_time: 22.0    # seconds ahead to project the Tesla path arc
  nav_speed_limit:   0.40   # hardware cap — used for recovery/escape and normalization
  nav_speed_nominal: 0.28   # expert's cruising speed on clear paths (~10 RPM, ~0.18 m/s)
  # Bucket states: 0=UP(travel)  1=COLLECT(digging)  2=DUMP(at berm)
  digging_speed:  0.12    # motor command during excavation — slower than nav for precision
  digging_steps:  38      # sim steps with bucket=1 (~4.6 s at DT=0.12)
  dumping_steps:  27      # sim steps stopped at berm with bucket=2 (~3.2 s)
  # Collision detection for training trajectory simulation
  robot_half_width: 0.375  # half of 0.75 m body — collision edge threshold
  danger_distance:  0.55   # metres to obstacle/wall edge that triggers recovery backing-up
  recovery_steps:   8      # sim steps to continue backing up after entering danger zone

model:
  cnn_channels: [64, 128, 256, 512]   # 4-block CNN, ~4.7 M params
  fc_dims: [512, 256, 128]
  heading_embed_dim: 16
  arena_embed_dim: 8
  zone_embed_dim: 8        # current arena zone (start/excavation/nav/deposit/berm/outside)
  phase_embed_dim: 8       # learned embedding for mission phase (0-3)
  lstm_hidden: 512
  lstm_layers: 2           # 2-layer LSTM, ~4.2 M params
  seq_len: 32              # base (overridden per curriculum stage)

training:
  epochs: 300           # hard ceiling; early stop usually fires well before this
  batch_size: 64             # B×T ≈ 16 K frames; reduce further if OOM with stage-3 seqs
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  val_ratio: 0.1
  seed: 42
  num_workers: -1          # -1 = auto (75 % of CPU cores)
  arenas_per_epoch: 500
  samples_per_arena: 20
  scale_min: 1.0           # fixed competition dimensions — no scale variation
  scale_max: 1.0
  grad_clip: 1.0
  early_stop_patience: 30
  bucket_loss_weight:    0.50   # weight of CrossEntropy bucket loss vs Huber motor loss
  speed_reg_weight:      0.05   # floor penalty (proximity now 0.03 so 0.05 is safe)
  proximity_reg_weight:  0.03   # rocks + craters + walls proximity (ch1+ch2+ch3)
  idle_reg_weight:       0.003  # tiny penalty for near-zero motor predictions (< 0.05 magnitude)
  loss_display_scale:    100    # multiply printed losses for readability — does NOT affect training
  arena_mix_ucf: 0.5            # 50/50 KSC / UCF split
  sim_dt: 0.10              # seconds per simulation step for sequence generation

# ── Curriculum ───────────────────────────────────────────────────────────────────
# Staged difficulty using ABSOLUTE epoch numbers (independent of max_epochs).
# This means you can set epochs=99999 to run indefinitely and stages still
# advance at the right time — stage 0 ends at epoch 40 regardless of how
# long the total run is.
#
# Stage 0  — empty arena, goal-seeking only (no obstacles).       epochs   1–15
# Stage 1  — 1–2 obstacles, all phases.  Robot learns basic avoidance. 16–50
# Stage 2  — full obstacles + DART recovery perturbations.  Core.  51–115
# Stage 3  — full obstacles + heavier DART.  Hardening / fine-tune. 116+
curriculum:
  stage0_end_epoch:  16   # epochs  1 – 15   (goal-seeking, no obstacles)
  stage1_end_epoch:  51   # epochs 16 – 50   (basic avoidance)
  stage2_end_epoch: 116   # epochs 51 – 115  (full obstacles + DART)
  # stage 3 = epoch 150+  (hardening, runs until early stop)
  dart_prob_s2: 0.30  # probability of DART perturbation in stage 2
  dart_prob_s3: 0.50  # probability of DART perturbation in stage 3
  dart_std_s2:  0.18  # metres of Gaussian noise on robot position in stage 2
  dart_std_s3:  0.32  # metres of Gaussian noise on robot position in stage 3
  # Sequence length grows with curriculum so the LSTM sees more temporal
  # context as the task difficulty demands it, and early-stage training stays fast.
  seq_len_s0:   8     # stage 0 — 0.8 s  (pure goal-seeking, no obstacles)
  seq_len_s1:  48     # stage 1 — 4.8 s  (robot must travel ~0.96 m, enough to encounter + avoid obstacles)
  seq_len_s2: 128     # stage 2 — 12.8 s (DART recovery + full avoidance manoeuvres)
  seq_len_s3: 256     # stage 3 — 25.6 s (covers ~1/3 of a full 15 m+ traverse at 0.20 m/s)

checkpoints:
  dir: "checkpoints"
  keep: 10
