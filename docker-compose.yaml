services:
  ros2_bridge:
    build:
      context: ./docker_setup
      dockerfile: Dockerfile
    image: ros2_bridge:latest
    container_name: ros2_bridge
    tty: true
    stdin_open: true
    # envsubst resolves ISAAC_SIM_HOST in the template at startup, writing the real IP
    # to /tmp/fastdds_bridge.xml before dropping to an interactive shell.
    command: bash -c "envsubst < /config/fastdds_bridge.xml.template > /tmp/fastdds_bridge.xml && exec bash"
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/tmp/fastdds_bridge.xml
      - ISAAC_SIM_HOST=${ISAAC_SIM_HOST}
    volumes:
      - ./workspace:/workspace
      - ./docker_setup/fastdds_bridge.xml.template:/config/fastdds_bridge.xml.template:ro
